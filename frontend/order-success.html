<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Order Confirmed | Velmira</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<header class="header">

    <nav class="navbar">

        <a href="index.html" class="logo">
            Vel<span>mira</span>
        </a>

        <div class="nav-actions">

            <a href="products.html" class="nav-icon">
                <i class="fa-solid fa-store"></i>
            </a>

            <a href="cart.html" class="nav-icon cart">
                <i class="fa-solid fa-bag-shopping"></i>
                <span>0</span>
            </a>

            <a href="login.html" class="account">
                <i class="fa-regular fa-user"></i>
                <span>Account</span>
            </a>

        </div>

    </nav>

</header>

<main>

    <section class="section">

        <div style="text-align:center; max-width:700px; margin:80px auto;">

            <i class="fa-solid fa-circle-check"
               style="font-size:70px;"></i>

            <p class="eyebrow" style="margin-top:25px;">
                ORDER CONFIRMED
            </p>

            <h1>
                Thank you for your order!
            </h1>

            <p style="margin:20px 0;">
                Your order has been successfully placed.
                We'll send you the delivery details shortly.
            </p>

            <a href="products.html" class="btn primary">
                Continue Shopping
                <i class="fa-solid fa-arrow-right"></i>
            </a>

        </div>

    </section>

</main>

<footer>

    <div class="footer-bottom">

        <p>© 2026 Velmira. All rights reserved.</p>

        <p>Secure shopping · Easy returns · Fast delivery</p>

    </div>

</footer>

<script src="js/main.js"></script>

</body>

</html>
