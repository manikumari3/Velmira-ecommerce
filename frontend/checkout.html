
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout | Velmira</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        .checkout-section {
            padding: 50px 20px;
        }

        .checkout-container {
            max-width: 1100px;
            margin: auto;

            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 35px;
        }

        .checkout-box {
            background: #fff;
            border-radius: 16px;
            padding: 28px;

            box-shadow: 0 8px 30px rgba(0,0,0,0.06);
        }

        .checkout-box h2 {
            margin-bottom: 22px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {

            width: 100%;

            padding: 13px 14px;

            border: 1px solid #ddd;

            border-radius: 9px;

            font-size: 14px;

            outline: none;

            box-sizing: border-box;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            border-color: #333;
        }

        .form-row {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 15px;
        }

        .order-item {

            display: flex;

            align-items: center;

            gap: 12px;

            padding: 12px 0;

            border-bottom: 1px solid #eee;
        }

        .order-item img {

            width: 65px;

            height: 65px;

            object-fit: cover;

            border-radius: 10px;

            background: #f5f5f5;
        }

        .order-item-info {
            flex: 1;
        }

        .order-item-info h4 {

            margin: 0 0 5px;

            font-size: 14px;
        }

        .order-item-info p {

            margin: 0;

            font-size: 13px;

            opacity: .7;
        }

        .order-item-price {

            font-weight: 600;

            white-space: nowrap;
        }

        .summary-row {

            display: flex;

            justify-content: space-between;

            margin: 15px 0;
        }

        .summary-row.total {

            border-top: 1px solid #ddd;

            padding-top: 18px;

            font-size: 19px;

            font-weight: 700;
        }

        .place-order-btn {

            width: 100%;

            border: none;

            padding: 15px;

            border-radius: 10px;

            cursor: pointer;

            font-size: 15px;

            font-weight: 600;

            margin-top: 15px;
        }

        .checkout-empty {

            text-align: center;

            padding: 70px 20px;
        }

        .checkout-empty i {

            font-size: 50px;

            opacity: .5;

            margin-bottom: 20px;
        }

        .order-success {

            text-align: center;

            padding: 60px 20px;
        }

        .order-success i {

            font-size: 55px;

            margin-bottom: 20px;
        }

        .order-success h2 {

            margin-bottom: 10px;
        }

        .order-success p {

            opacity: .7;

            margin-bottom: 25px;
        }

        @media (max-width: 750px) {

            .checkout-container {
                grid-template-columns: 1fr;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .checkout-box {
                padding: 20px;
            }

        }

    </style>

</head>


<body>


<!-- =========================================
     HEADER
========================================= -->

<header class="header">

    <nav class="navbar">

        <a href="index.html" class="logo">
            Vel<span>mira</span>
        </a>


        <div class="search-box">

            <i class="fa-solid fa-magnifying-glass"></i>

            <input
                type="text"
                placeholder="Search products, brands and more">

        </div>


        <div class="nav-actions">

            <a
                href="wishlist.html"
                class="nav-icon">

                <i class="fa-solid fa-heart"></i>

            </a>


            <a
                href="cart.html"
                class="nav-icon cart">

                <i class="fa-solid fa-bag-shopping"></i>

                <span id="cartCount">
                    0
                </span>

            </a>


            <a
                href="login.html"
                class="account">

                <i class="fa-regular fa-user"></i>

                <span>Account</span>

            </a>

        </div>

    </nav>

</header>



<!-- =========================================
     MAIN
========================================= -->

<main>

<section class="checkout-section">


    <div class="section-heading">

        <div>

            <p class="eyebrow">
                SECURE CHECKOUT
            </p>

            <h2>
                Checkout
            </h2>

        </div>

    </div>


    <div
        id="checkout-content"
        class="checkout-container">

    </div>


</section>

</main>



<!-- =========================================
     FOOTER
========================================= -->

<footer>

    <div class="footer-bottom">

        <p>
            © 2026 Velmira. All rights reserved.
        </p>

        <p>
            Made for everyday shopping.
        </p>

    </div>

</footer>



<script src="js/main.js"></script>


<script>

document.addEventListener("DOMContentLoaded", () => {


    /* =========================================
       ELEMENT
    ========================================= */

    const content =
        document.getElementById(
            "checkout-content"
        );


    const cartCount =
        document.getElementById(
            "cartCount"
        );


    /* =========================================
       API
    ========================================= */

    const API_URL =
        "https://velmira-ecommerce.onrender.com";


    /* =========================================
       GET USER
    ========================================= */

    function getCurrentUser() {

        try {

            return JSON.parse(
                localStorage.getItem(
                    "velmiraUser"
                )
            );

        } catch (error) {

            return null;

        }

    }


    const user =
        getCurrentUser();


    /* =========================================
       GET USER ID
    ========================================= */

    function getUserId() {

        if (!user) {
            return null;
        }

        return String(

            user.id ||
            user._id ||
            user.userId ||
            ""

        ).trim();

    }


    const userId =
        getUserId();


    /* =========================================
       LOGIN CHECK
    ========================================= */

    if (!userId || !user.email) {

        content.innerHTML = `

            <div class="checkout-box checkout-empty"
                 style="grid-column:1/-1;">

                <i class="fa-regular fa-user"></i>

                <h2>
                    Please login first
                </h2>

                <p>
                    Login to continue with your order.
                </p>

                <a
                    href="login.html"
                    class="btn primary">

                    Login

                </a>

            </div>

        `;

        return;

    }


    /* =========================================
       CUSTOMER CART KEY
    ========================================= */

    const CART_KEY =
        "velmiraCart_" + userId;


    /* =========================================
       GET CART
    ========================================= */

    function getCart() {

        try {

            return JSON.parse(
                localStorage.getItem(
                    CART_KEY
                )
            ) || [];

        } catch (error) {

            return [];

        }

    }


    /* =========================================
       SAVE CART
    ========================================= */

    function saveCart(cart) {

        localStorage.setItem(

            CART_KEY,

            JSON.stringify(cart)

        );

    }


    /* =========================================
       PRICE
    ========================================= */

    function getPrice(value) {

        if (typeof value === "number") {
            return value;
        }

        return Number(

            String(value || "")
                .replace(/[₹,\s]/g, "")

        ) || 0;

    }


    /* =========================================
       ESCAPE HTML
    ========================================= */

    function escapeHTML(value) {

        return String(value || "")

            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    /* =========================================
       LOAD CHECKOUT
    ========================================= */

    function loadCheckout() {


        const cart =
            getCart();


        /* =====================================
           EMPTY CART
        ===================================== */

        if (cart.length === 0) {

            content.innerHTML = `

                <div
                    class="checkout-box checkout-empty"
                    style="grid-column:1/-1;">

                    <i
                        class="fa-solid fa-bag-shopping">
                    </i>

                    <h2>
                        Your cart is empty
                    </h2>

                    <p>
                        Add some products before checking out.
                    </p>

                    <a
                        href="products.html"
                        class="btn primary">

                        Explore Products

                    </a>

                </div>

            `;

            return;

        }


        /* =====================================
           CALCULATE TOTAL
        ===================================== */

        const subtotal =
            cart.reduce(

                (total, item) => {

                    const price =
                        getPrice(item.price);


                    const quantity =
                        Number(
                            item.quantity
                        ) || 1;


                    return total +
                        price * quantity;

                },

                0

            );


        const shipping =
            subtotal >= 999
                ? 0
                : 99;


        const total =
            subtotal + shipping;


        /* =====================================
           DISPLAY CHECKOUT
        ===================================== */

        content.innerHTML = `

            <!-- CUSTOMER DETAILS -->

            <div class="checkout-box">

                <h2>
                    Delivery Details
                </h2>


                <form id="checkout-form">


                    <div class="form-group">

                        <label>
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="fullName"
                            placeholder="Enter your full name"
                            value="${escapeHTML(
                                user.name || ""
                            )}"
                            required>

                    </div>


                    <div class="form-group">

                        <label>
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                            value="${escapeHTML(
                                user.email || ""
                            )}"
                            required>

                    </div>


                    <div class="form-group">

                        <label>
                            Phone Number
                        </label>

                        <input
                            type="tel"
                            id="phone"
                            placeholder="Enter your phone number"
                            required>

                    </div>


                    <div class="form-group">

                        <label>
                            Address
                        </label>

                        <textarea
                            id="address"
                            rows="4"
                            placeholder="House number, street, area"
                            required></textarea>

                    </div>


                    <div class="form-row">


                        <div class="form-group">

                            <label>
                                City
                            </label>

                            <input
                                type="text"
                                id="city"
                                placeholder="City"
                                required>

                        </div>


                        <div class="form-group">

                            <label>
                                State
                            </label>

                            <input
                                type="text"
                                id="state"
                                placeholder="State"
                                required>

                        </div>


                    </div>


                    <div class="form-row">


                        <div class="form-group">

                            <label>
                                Pincode
                            </label>

                            <input
                                type="text"
                                id="pincode"
                                placeholder="6-digit pincode"
                                maxlength="6"
                                required>

                        </div>


                        <div class="form-group">

                            <label>
                                Payment Method
                            </label>

                            <select id="paymentMethod">

                                <option value="COD">
                                    Cash on Delivery
                                </option>

                                <option value="UPI">
                                    UPI
                                </option>

                                <option value="CARD">
                                    Credit / Debit Card
                                </option>

                            </select>

                        </div>


                    </div>


                    <button
                        type="submit"
                        id="placeOrderButton"
                        class="btn primary place-order-btn">

                        <i
                            class="fa-solid fa-lock">
                        </i>

                        Place Order · ₹${total.toLocaleString("en-IN")}

                    </button>


                </form>

            </div>



            <!-- ORDER SUMMARY -->

            <div class="checkout-box">

                <h2>
                    Order Summary
                </h2>


                <div id="order-items">

                    ${cart.map(item => {

                        const name =
                            item.name ||
                            "Product";


                        const image =
                            item.image ||
                            "https://via.placeholder.com/100x100?text=Velmira";


                        const price =
                            getPrice(
                                item.price
                            );


                        const quantity =
                            Number(
                                item.quantity
                            ) || 1;


                        return `

                            <div class="order-item">

                                <img
                                    src="${escapeHTML(image)}"
                                    alt="${escapeHTML(name)}"
                                    onerror="
                                        this.src='https://via.placeholder.com/100x100?text=Velmira';
                                    ">


                                <div class="order-item-info">

                                    <h4>
                                        ${escapeHTML(name)}
                                    </h4>

                                    <p>
                                        Quantity: ${quantity}
                                    </p>

                                </div>


                                <div class="order-item-price">

                                    ₹${(
                                        price * quantity
                                    ).toLocaleString("en-IN")}

                                </div>

                            </div>

                        `;

                    }).join("")}

                </div>


                <div class="summary-row">

                    <span>
                        Subtotal
                    </span>

                    <strong>
                        ₹${subtotal.toLocaleString("en-IN")}
                    </strong>

                </div>


                <div class="summary-row">

                    <span>
                        Shipping
                    </span>

                    <strong>

                        ${
                            shipping === 0
                                ? "FREE"
                                : "₹" +
                                  shipping.toLocaleString(
                                      "en-IN"
                                  )
                        }

                    </strong>

                </div>


                <div class="summary-row total">

                    <span>
                        Total
                    </span>

                    <strong>
                        ₹${total.toLocaleString("en-IN")}
                    </strong>

                </div>


                <p style="
                    font-size:13px;
                    opacity:.65;
                    margin-top:20px;
                ">

                    <i class="fa-solid fa-shield-halved"></i>

                    Your order information is securely processed.

                </p>

            </div>

        `;


        /* =====================================
           FORM SUBMIT
        ===================================== */

        const form =
            document.getElementById(
                "checkout-form"
            );


        const placeOrderButton =
            document.getElementById(
                "placeOrderButton"
            );


        form.addEventListener(
            "submit",
            async event => {

                event.preventDefault();


                /* ==============================
                   GET FORM VALUES
                ============================== */

                const fullName =
                    document.getElementById(
                        "fullName"
                    ).value.trim();


                const email =
                    document.getElementById(
                        "email"
                    ).value.trim()
                        .toLowerCase();


                const phone =
                    document.getElementById(
                        "phone"
                    ).value.trim();


                const address =
                    document.getElementById(
                        "address"
                    ).value.trim();


                const city =
                    document.getElementById(
                        "city"
                    ).value.trim();


                const state =
                    document.getElementById(
                        "state"
                    ).value.trim();


                const pincode =
                    document.getElementById(
                        "pincode"
                    ).value.trim();


                const paymentMethod =
                    document.getElementById(
                        "paymentMethod"
                    ).value;


                /* ==============================
                   BASIC VALIDATION
                ============================== */

                if (
                    !fullName ||
                    !email ||
                    !phone ||
                    !address ||
                    !city ||
                    !state ||
                    !pincode
                ) {

                    alert(
                        "Please fill all delivery details."
                    );

                    return;

                }


                if (!/^\d{6}$/.test(pincode)) {

                    alert(
                        "Please enter a valid 6-digit pincode."
                    );

                    return;

                }


                const cleanPhone =
                    phone.replace(/\D/g, "");


                if (
                    !/^\d{10}$/.test(
                        cleanPhone
                    )
                ) {

                    alert(
                        "Please enter a valid 10-digit phone number."
                    );

                    return;

                }


                /* ==============================
                   PREPARE PRODUCTS FOR BACKEND
                ============================== */

                const backendProducts =
                    cart.map(item => ({

                        productId:
                            item.productId ||
                            item.id ||
                            item._id,

                        name:
                            item.name ||
                            "Product",

                        category:
                            item.category ||
                            "General",

                        price:
                            getPrice(
                                item.price
                            ),

                        quantity:
                            Number(
                                item.quantity
                            ) || 1,

                        image:
                            item.image ||
                            ""

                    }));


                /* ==============================
                   CHECK PRODUCT IDS
                ============================== */

                const invalidProduct =
                    backendProducts.some(
                        product =>
                            !product.productId
                    );


                if (invalidProduct) {

                    alert(
                        "One or more products have an invalid product ID. Please return to the products page and add them again."
                    );

                    return;

                }


                /* ==============================
                   CUSTOMER OBJECT
                ============================== */

                const customer = {

                    name:
                        fullName,

                    email:
                        email,

                    phone:
                        cleanPhone,

                    address:
                        address,

                    city:
                        city,

                    state:
                        state,

                    pincode:
                        pincode

                };


                /* ==============================
                   DISABLE BUTTON
                ============================== */

                placeOrderButton.disabled =
                    true;


                placeOrderButton.innerHTML = `

                    <i class="fa-solid fa-spinner fa-spin"></i>

                    Placing Order...

                `;


                try {


                    /* ==============================
                       SEND ORDER TO MONGODB
                    ============================== */

                    const response =
                        await fetch(
                            `${API_URL}/api/orders`,
                            {

                                method: "POST",

                                headers: {

                                    "Content-Type":
                                        "application/json"

                                },

                                body:
                                    JSON.stringify({

                                        customer:

                                            customer,

                                        products:

                                            backendProducts,

                                        totalAmount:

                                            total

                                    })

                            }
                        );


                    let data;


                    try {

                        data =
                            await response.json();

                    } catch {

                        data = {};

                    }


                    /* ==============================
                       BACKEND ERROR
                    ============================== */

                    if (!response.ok) {

                        throw new Error(

                            data.message ||
                            "Failed to place order"

                        );

                    }


                    /* ==============================
                       SAVE LOCAL ORDER TOO
                    ============================== */

                    const localOrder = {

                        orderId:
                            data.order &&
                            data.order._id
                                ? String(
                                    data.order._id
                                )
                                : "VEL" +
                                  Date.now(),

                        userId:
                            userId,

                        customer:
                            customer,

                        products:
                            backendProducts,

                        totalAmount:
                            total,

                        paymentMethod:
                            paymentMethod,

                        status:
                            "Pending",

                        createdAt:
                            new Date().toISOString()

                    };


                    const ORDER_KEY =
                        "velmiraOrders_" +
                        userId;


                    let orders = [];


                    try {

                        orders =
                            JSON.parse(
                                localStorage.getItem(
                                    ORDER_KEY
                                )
                            ) || [];

                    } catch {

                        orders = [];

                    }


                    orders.push(
                        localOrder
                    );


                    localStorage.setItem(

                        ORDER_KEY,

                        JSON.stringify(
                            orders
                        )

                    );


                    /* ==============================
                       CLEAR CART
                    ============================== */

                    saveCart([]);


                    /* ==============================
                       UPDATE CART COUNT
                    ============================== */

                    if (cartCount) {

                        cartCount.textContent =
                            "0";

                    }


                    /* ==============================
                       SUCCESS
                    ============================== */

                    const backendOrderId =
                        data.order &&
                        data.order._id
                            ? String(
                                data.order._id
                            ).slice(-8)
                            : localOrder.orderId;


                    content.innerHTML = `

                        <div
                            class="checkout-box order-success"
                            style="grid-column:1/-1;">

                            <i
                                class="fa-solid fa-circle-check">
                            </i>


                            <h2>
                                Order Placed Successfully!
                            </h2>


                            <p>
                                Thank you for shopping with Velmira.
                            </p>


                            <p>
                                Order ID:

                                <strong>
                                    ${escapeHTML(
                                        backendOrderId
                                    )}
                                </strong>
                            </p>


                            <div style="
                                display:flex;
                                gap:12px;
                                justify-content:center;
                                flex-wrap:wrap;
                                margin-top:20px;
                            ">

                                <a
                                    href="products.html"
                                    class="btn primary">

                                    Continue Shopping

                                </a>


                                <a
                                    href="order-history.html"
                                    class="btn">

                                    View My Orders

                                </a>


                                <a
                                    href="index.html"
                                    class="btn">

                                    Go Home

                                </a>

                            </div>

                        </div>

                    `;


                } catch (error) {


                    console.error(
                        "ORDER PLACEMENT ERROR:",
                        error
                    );


                    alert(
                        error.message ||
                        "Unable to place order. Please try again."
                    );


                    placeOrderButton.disabled =
                        false;


                    placeOrderButton.innerHTML = `

                        <i class="fa-solid fa-lock"></i>

                        Place Order · ₹${total.toLocaleString("en-IN")}

                    `;

                }

            }
        );

    }


    /* =========================================
       START
    ========================================= */

    loadCheckout();

});

</script>

</body>

</html>
